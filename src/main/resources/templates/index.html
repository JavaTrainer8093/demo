<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sender</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #f093fb
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            max-width: 620px;
            width: 100%;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-in-out;
        }

        h3 {
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            border-radius: 12px;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .btn-send:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, #4e63d7, #623aa2);
        }

        .modal-content {
            border-radius: 18px;
            animation: popIn 0.4s ease;
        }

        .modal-header {
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>

</head>
<body>

<div class="card shadow-lg p-4">
    <h3 class="text-center mb-4">📧 Professional Email Sender</h3>

    <form method="post" action="/send-email" enctype="multipart/form-data" id="emailForm">

        <div class="mb-3">
            <label class="form-label">Gmail</label>
            <input type="email" class="form-control" name="email" id="email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">App Password</label>
            <input type="password" class="form-control" name="appPassword" id="appPassword" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control" name="subject" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" name="message" rows="5" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Recipients (.txt)</label>
            <input type="file" class="form-control" name="recipients" accept=".txt" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Attachment (optional)</label>
            <input type="file" class="form-control" name="attachment">
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-send">
            🚀 Send Emails
        </button>
    </form>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Success</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                ✅ Emails sent successfully!
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 🔐 Restore saved credentials
    document.getElementById("email").value =
        localStorage.getItem("savedEmail") || "";

    document.getElementById("appPassword").value =
        localStorage.getItem("savedPassword") || "";

    // 💾 Save credentials on submit
    document.getElementById("emailForm").addEventListener("submit", function () {
        localStorage.setItem("savedEmail",
            document.getElementById("email").value);

        localStorage.setItem("savedPassword",
            document.getElementById("appPassword").value);
    });

    // 🎉 Show success popup if backend redirects with ?success
    if (window.location.search.includes("success")) {
        const modal = new bootstrap.Modal(
            document.getElementById("successModal")
        );
        modal.show();
    }
</script>

</body>
</html>
